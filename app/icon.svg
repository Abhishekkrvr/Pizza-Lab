<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pizza base (golden crust) -->
  <circle cx="50" cy="50" r="48" fill="#E8A44A"/>
  <!-- Pizza sauce (red) -->
  <circle cx="50" cy="50" r="40" fill="#C4562F"/>
  <!-- Cheese layer (yellow) -->
  <circle cx="50" cy="50" r="33" fill="#F0C040"/>

  <!-- Pepperoni slices -->
  <circle cx="50" cy="32" r="7" fill="#9B2417"/>
  <circle cx="35" cy="55" r="7" fill="#9B2417"/>
  <circle cx="63" cy="55" r="7" fill="#9B2417"/>

  <!-- Pepperoni highlights -->
  <circle cx="48" cy="30" r="2" fill="#C03020" opacity="0.5"/>
  <circle cx="33" cy="53" r="2" fill="#C03020" opacity="0.5"/>
  <circle cx="61" cy="53" r="2" fill="#C03020" opacity="0.5"/>

  <!-- Crust edge highlight -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#D4894A" stroke-width="2"/>

  <!-- Slice lines -->
  <line x1="50" y1="2" x2="50" y2="98" stroke="#D4894A" stroke-width="1.5" opacity="0.4"/>
  <line x1="2" y1="50" x2="98" y2="50" stroke="#D4894A" stroke-width="1.5" opacity="0.4"/>
  <line x1="15" y1="15" x2="85" y2="85" stroke="#D4894A" stroke-width="1.5" opacity="0.4"/>
  <line x1="85" y1="15" x2="15" y2="85" stroke="#D4894A" stroke-width="1.5" opacity="0.4"/>
</svg>
